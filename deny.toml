# Dependency policy for a commercial, closed-source product.
# Copyleft licenses (GPL, AGPL, LGPL) are rejected by omission from `allow`.

[graph]
all-features = true

[advisories]
version = 2

[licenses]
version = 2
# Allow-list is the set we are willing to take on, not only what the
# current graph uses. Unused entries warn; they do not fail the check.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
